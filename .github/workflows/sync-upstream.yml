name: Sync OpenWiki upstream

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * 1"

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out hwj-wiki
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0

      - name: Merge upstream OpenWiki
        id: merge
        env:
          UPSTREAM_URL: https://github.com/langchain-ai/openwiki.git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream "$UPSTREAM_URL"
          git fetch upstream main
          git fetch origin automation/sync-upstream:refs/remotes/origin/automation/sync-upstream || true
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git switch -C automation/sync-upstream
          git merge --no-edit upstream/main
          git push --force-with-lease origin automation/sync-upstream
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Open upstream sync pull request
        if: steps.merge.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create \
            --base main \
            --head automation/sync-upstream \
            --title "chore: sync OpenWiki upstream" \
            --body "Automated merge of the latest langchain-ai/openwiki main branch. Review personalization adapter conflicts and checks before merging." \
            || gh pr view automation/sync-upstream
